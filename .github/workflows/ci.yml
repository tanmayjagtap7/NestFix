name: CI

on:
  push:
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        run: pip install -r requirements.txt
      - name: Confirm the GitHub secrets are available
        run: python -c "import os; missing=[name for name in ('GEMINI_API_KEY','BRIGHT_DATA_API_KEY') if not os.getenv(name)]; raise SystemExit('Missing repository secrets: ' + ', '.join(missing)) if missing else None"
